# NoSlop proxy worker. Deploy with: npx wrangler@latest deploy
# Then set the secret once: npx wrangler secret put PROXY_SECRET
# (Rate limit bindings need Wrangler 4.36.0 or later.)
name = "yt-proxy"
main = "worker.js"
compatibility_date = "2026-11-01"

# Per client address and route: 120 requests a minute. Tor users share exit addresses,
# so keep this generous; the app goes direct when it gets a 429.
[[ratelimits]]
name = "CLIENT_LIMITER"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 120
  period = 60

# Per route (youtube, reddit, jamendo): 600 requests a minute in each Cloudflare
# location, so one route can't use up the account's daily requests.
[[ratelimits]]
name = "ROUTE_LIMITER"
namespace_id = "1002"
  [ratelimits.simple]
  limit = 600
  period = 60
